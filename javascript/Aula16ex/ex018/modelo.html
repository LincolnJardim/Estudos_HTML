<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Analisador de Números</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>

    <section>
        <div>
            <p>Número (entre 1 e 100): <input type="number" name="num" id="numerotxt">

            <select name="valores" id="lista" size="10"></select>

            <br>

            <input onclick="finalizar()" type="button" value="Finalizar">
        </div>

        <div  id="resultado">

        </div>
    </section>

    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>

    <script src="script.js"></script>

</html>
